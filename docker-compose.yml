services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/cartera.db
    volumes:
      - cartera_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  cartera_data:
